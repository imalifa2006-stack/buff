services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: baf
      POSTGRES_PASSWORD: baf_dev_password
      POSTGRES_DB: baf
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
volumes:
  pgdata: {}
