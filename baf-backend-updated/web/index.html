<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>باف | گزارش مطالعه</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--card:#fff;--ink:#17251c;--mut:#5f7568;--line:#b4e0c5;--p:#1f9d57;--p2:#e8f6ee;--chip:#f1faf5;--warn:#b7791f;--warnb:#fff6e0;--blue:#2f80ed;--blueb:#eaf2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0e1913;--card:#14231b;--ink:#eaf6ef;--mut:#9ab5a5;--line:#2c5a41;--p:#3ecf7a;--p2:#1b3a29;--chip:#1a2d22;--warnb:#3a2e12;--blueb:#16283f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,Arial,sans-serif;line-height:1.8}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:520px;margin:auto;padding:14px 16px 130px}
.scr{animation:up .35s ease-out}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.av{width:46px;height:46px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,#d4f3e1,#7fd1a2);color:#12703b;font-weight:800;font-size:19px;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:0}.who small{display:block;color:var(--mut);font-size:12px;line-height:1.4}.who b{font-size:16px}
.vb{font-size:10px;padding:2px 9px;border-radius:20px;background:var(--chip);color:var(--mut);border:1px solid var(--line)}.vb.ok{background:var(--p2);color:var(--p)}
.idc{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);background:var(--chip);border:1px dashed var(--line);border-radius:14px;padding:7px 12px;margin-bottom:12px}.idc b{color:var(--ink);font-size:14px;letter-spacing:.5px}.idc button{margin-right:auto;color:var(--p);font-size:12px;font-weight:600}
.lv{border:1px solid var(--line);border-radius:20px;padding:14px;background:linear-gradient(140deg,var(--p2),var(--card))}
.lvh{display:flex;gap:12px;align-items:center}.em{font-size:30px}.lvh b{display:block;font-size:15px;line-height:1.5}.lvh small{color:var(--mut);font-size:12px}
.pb{height:9px;border-radius:9px;background:var(--line);margin-top:11px;overflow:hidden}.pb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#34c27a,#1f9d57);animation:fill .9s ease-out}@keyframes fill{from{width:0!important}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stats div{border:1px solid var(--line);border-radius:16px;text-align:center;padding:9px 4px;background:var(--card)}.stats b{display:block;font-size:20px;line-height:1.4}.stats small{color:var(--mut);font-size:11px}
.cta{width:100%;padding:14px;border-radius:16px;background:linear-gradient(135deg,#34c27a,#1f9d57);color:#fff;font-weight:800;font-size:15px;box-shadow:0 10px 24px #1f9d5733;transition:transform .15s}.cta:active{transform:scale(.97)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}.sh h3{margin:0;font-size:15px}.sh button{color:var(--p);font-size:12px}
.rc{border:1px solid var(--line);border-radius:18px;padding:12px 13px;margin-bottom:9px;background:var(--card);cursor:pointer;transition:.2s}.rc.op{border-color:var(--p);box-shadow:0 8px 22px #1f9d5714}
.rh{display:flex;gap:10px;align-items:center}.ce{width:40px;height:40px;border-radius:13px;background:var(--p2);display:grid;place-items:center;font-size:20px;flex:none}.rt{flex:1;min-width:0}.rt b{display:block;font-size:13px;line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rt small{color:var(--mut);font-size:11px}
.stc{font-size:10px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.rb{max-height:0;overflow:hidden;transition:max-height .3s}.op .rb{max-height:320px}.rb p{margin:10px 0 6px;font-size:12px;color:var(--mut);white-space:pre-wrap;word-break:break-word}.rm{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--mut)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;margin-bottom:6px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:22px;padding:5px 14px;font-size:12px;color:var(--mut)}.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.empty{text-align:center;color:var(--mut);padding:30px 10px;border:1px dashed var(--line);border-radius:18px;font-size:13px}.empty i{display:block;font-size:34px;font-style:normal}
.fh{display:flex;align-items:center;gap:10px;margin-bottom:6px}.fh h2{margin:0;font-size:19px}.bk{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);font-size:16px}
label{display:flex;justify-content:space-between;font-weight:600;font-size:13px;margin:16px 0 7px}label small{font-weight:400;color:var(--mut)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cat{border:1.5px solid var(--line);border-radius:15px;padding:10px 8px;font-size:12px;display:flex;gap:8px;align-items:center;transition:.15s}.cat i{font-style:normal;font-size:19px}.cat.on{border-color:var(--p);background:var(--p2);font-weight:600}
.pri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pri .cat{justify-content:center}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:15px;padding:11px 13px;font:inherit;font-size:14px;color:var(--ink);background:var(--card);outline:0;transition:border-color .2s}textarea{resize:vertical;min-height:130px}input:focus,textarea:focus{border-color:var(--p)}
.err{color:#d6453d;font-size:12px;min-height:22px;margin-top:6px}.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.idn{font-size:12px;color:var(--mut);background:var(--chip);border-radius:13px;padding:8px 12px;margin:6px 0 14px}.idn b{color:var(--ink)}
.done{text-align:center;padding-top:40px;position:relative}.big{font-size:70px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(0)}}
.done h2{margin:6px 0 2px}.code{display:inline-block;margin:14px 0;border:2px dashed var(--p);border-radius:14px;padding:6px 20px;font-size:20px;font-weight:800;color:var(--p);letter-spacing:2px}
.conf{position:absolute;top:60px;left:50%;pointer-events:none}.conf i{position:absolute;font-style:normal;font-size:20px;animation:fly 1.5s ease-out forwards;opacity:0}@keyframes fly{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.sec2{width:100%;margin-top:9px;padding:12px;border-radius:15px;border:1.5px solid var(--line);font-weight:600;font-size:14px}
nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;gap:46px;padding:8px 20px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}nav.hid{display:none}
nav button{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);min-width:64px}nav button i{font-style:normal;font-size:21px}nav button.on{color:var(--p);font-weight:700}
.fab{width:56px;height:56px;border-radius:50%!important;min-width:0!important;margin-top:-26px;background:linear-gradient(135deg,#34c27a,#1f9d57);color:#fff!important;font-size:28px!important;box-shadow:0 10px 22px #1f9d5744;justify-content:center;animation:pulse 2.4s infinite}@keyframes pulse{50%{box-shadow:0 10px 30px #1f9d5788}}
#toast{position:fixed;z-index:50;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#123d27;color:#fff;border-radius:13px;padding:8px 16px;font-size:12px;display:none;white-space:nowrap}
.ov{position:fixed;inset:0;background:#0007;z-index:40;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .3s}
.step{display:flex;align-items:center;gap:6px}.step button{width:42px;height:42px;border-radius:13px;background:var(--p2);color:var(--p);font-size:22px;font-weight:700;flex:none}.step input{text-align:center;font-weight:800;font-size:18px;padding:8px 0;min-width:0;flex:1}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.row3 small{display:block;text-align:center;color:var(--mut);font-size:11px;margin-bottom:4px}.row3 .step{gap:3px}.row3 .step button{width:30px;height:38px;font-size:18px;border-radius:10px}.row3 .step input{font-size:15px}
.pcw{display:flex;gap:16px;align-items:center;justify-content:center;margin:12px 0 2px}.pcw svg{width:92px;height:92px}.pcw b{font-size:12px;display:block;line-height:2}
.ent{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:9px 12px;margin-bottom:8px;cursor:pointer}.ent .n{flex:1;min-width:0}.ent b{font-size:13px}.ent small{display:block;color:var(--mut);font-size:11px}.ent .x{color:#d6453d;font-size:15px;padding:6px}.pct{font-weight:800;font-size:14px;min-width:44px;text-align:center}
.addb{width:100%;border:2px dashed var(--line);border-radius:16px;padding:12px;color:var(--p);font-weight:600;margin:2px 0 10px}
.sumb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--p2);border-radius:16px;padding:10px;text-align:center}.sumb b{display:block;font-size:16px;line-height:1.6}.sumb small{color:var(--mut);font-size:11px}
.moods,.stars{display:flex;gap:8px}.moods button{flex:1;font-size:24px;border:1.5px solid var(--line);border-radius:14px;padding:5px 0;opacity:.55}.moods button.on{opacity:1;border-color:var(--p);background:var(--p2)}.stars button{font-size:30px;color:var(--line);flex:1}.stars button.on{color:#f0a800}
.bars{display:flex;gap:7px;align-items:flex-end;height:104px;margin:10px 0 4px}.bars div{flex:1;text-align:center;font-size:10px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#34c27a,#1f9d57);min-height:3px;animation:grow .7s ease-out;transform-origin:bottom}.bars .t i{background:linear-gradient(180deg,#5aa8ff,#2f80ed)}@keyframes grow{from{transform:scaleY(0)}}
.card2{border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0}.card2 h4{margin:0;font-size:14px}.card2 small{color:var(--mut);font-size:11px}
.fc{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center;width:100%;text-align:right}.fc.on{border-color:var(--p);background:var(--p2)}.fc i{font-style:normal;font-size:26px}
.hl{font-size:12px;color:var(--mut);padding:3px 0}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeS()"><div class="sheet" id="sheet"></div></div>
<script>
const $=id=>document.getElementById(id),fa=n=>Number(n).toLocaleString('fa-IR');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---- Telegram identity ---- */
const tg=window.Telegram&&window.Telegram.WebApp,TU=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,inTg=!!TU;
const U=TU||{id:123456789,first_name:'علی',last_name:'رضایی',username:'demo_user'};
const NAME=[U.first_name,U.last_name].filter(Boolean).join(' ');
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#ffffff');tg.setBackgroundColor('#ffffff');tg.BackButton.onClick(()=>go('home'))}catch(e){}}
const hap=(t='light')=>{try{tg.HapticFeedback.impactOccurred(t)}catch(e){}};
/* ---- config ---- */
const FIELDS={r:['📐','ریاضی و فیزیک',['ریاضی','فیزیک','شیمی','ادبیات','عربی','دین و زندگی','زبان انگلیسی']],t:['🧬','علوم تجربی',['زیست‌شناسی','شیمی','فیزیک','ریاضی','ادبیات','عربی','دین و زندگی','زبان انگلیسی']],e:['📖','علوم انسانی',['ادبیات اختصاصی','عربی اختصاصی','فلسفه و منطق','جامعه‌شناسی','تاریخ','جغرافیا','اقتصاد','ریاضی و آمار','دین و زندگی','زبان انگلیسی']]};
const GR=['دهم','یازدهم','دوازدهم','فارغ‌التحصیل'],MOOD=['😫','😕','😐','🙂','🤩'],WD=['ی','د','س','چ','پ','ج','ش'],GOAL=240;
const iso=o=>{const d=new Date();d.setDate(d.getDate()-o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dt=k=>new Date(k+'T12:00:00'),fd=k=>dt(k).toLocaleDateString('fa-IR',{weekday:'long',day:'numeric',month:'long'});
const hm=m=>{const h=Math.floor(m/60),r=m%60;return h?fa(h)+' ساعت'+(r?' و '+fa(r)+' دقیقه':''):fa(r)+' دقیقه'};
const pc=e=>e.tests?Math.round((3*e.ok-e.bad)/(3*e.tests)*100):null; /* konkur scoring: +3 correct, -1 wrong */
const col=p=>p==null?'var(--mut)':p>=60?'var(--p)':p>=30?'var(--warn)':'#d6453d';
const sumR=r=>{const t=r.entries.reduce((a,e)=>({min:a.min+e.min,tests:a.tests+e.tests,ok:a.ok+e.ok,bad:a.bad+e.bad}),{min:0,tests:0,ok:0,bad:0});t.pc=pc(t);return t};
const ring=p=>{const v=Math.max(0,Math.min(100,p||0)),C=2*Math.PI*38;return `<svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="46" cy="46" r="38" fill="none" stroke="${col(p)}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C*v/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 46 46)"/><text x="46" y="52" text-anchor="middle" font-size="17" font-weight="800" fill="${col(p)}">${p==null?'—':fa(p)+'٪'}</text></svg>`};
const GL={'10':'دهم','11':'یازدهم','12':'دوازدهم','grad':'فارغ‌التحصیل'};
const DEV=new URLSearchParams(location.search).get('dev'),INIT=(tg&&tg.initData)||(DEV?'dev:'+DEV+':dev_user'+DEV+':Dev'+DEV:'');
const TK='baf_token_'+(TU?TU.id:(DEV||'x'));
let S={user:null,subjects:[],reports:{}},TOKEN=null;try{TOKEN=localStorage.getItem(TK)}catch(e){}
let view='load',boot=null,rg={f:null,g:null,u:'',p:'',c:'',err:''},F=null,E=null,last=null,open=null;
async function api(path,opt={}){const h={'Content-Type':'application/json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;if(INIT)h['X-Telegram-Init-Data']=INIT;
 const r=await fetch(path,Object.assign({},opt,{headers:h}));let d=null;try{d=await r.json()}catch(e){}
 if(!r.ok){const er=new Error('api');er.status=r.status;er.detail=d&&typeof d.detail==='string'?d.detail:null;throw er}return d}
const setTok=t=>{TOKEN=t;try{localStorage.setItem(TK,t)}catch(e){}};
const fromApi=r=>({sleep:+r.sleep_hours,mood:r.mood,focus:r.focus,note:r.note||'',entries:r.entries.map(e=>({sid:e.subject_id,sub:e.subject,min:e.minutes,tests:e.tests,ok:e.correct,bad:e.wrong}))});
async function loadData(){const d=await api('/api/bootstrap?start='+iso(60)+'&end='+iso(0));S.user=d.user;S.plan=d.plan||null;S.subjects=d.subjects;S.reports={};d.reports.forEach(r=>{S.reports[String(r.report_date).slice(0,10)]=fromApi(r)})}
async function startApp(){
 if(!INIT){view='notg';return render()}
 try{
  if(TOKEN){try{await loadData();view='home';return render()}catch(e){TOKEN=null}}
  const d=await api('/api/auth/telegram',{method:'POST',body:JSON.stringify({init_data:INIT})});
  if(d.registered){setTok(d.token);S.user=d.user;await loadData();view='home'}else{boot=d;view=d.can_register?'reg':'denied'}
 }catch(e){view='err'}
 render()}
function streak(){let n=0,o=S.reports[iso(0)]?0:1;while(S.reports[iso(o)]){n++;o++}return n}
const line=e=>`${esc(e.sub)} · ${hm(e.min)} · ${fa(e.tests)} تست (✅ ${fa(e.ok)} ❌ ${fa(e.bad)}${pc(e)!=null?' · '+fa(pc(e))+'٪':''})`;
const dayCard=k=>{const r=S.reports[k],s=sumR(r);return `<article class="rc ${open===k?'op':''}" onclick="tog('${k}')"><div class="rh"><span class="ce">🗓</span><div class="rt"><b>${fd(k)}</b><small>${hm(s.min)} · ${fa(s.tests)} تست</small></div><span class="stc" style="color:${col(s.pc)};background:var(--chip)">${s.pc==null?'—':fa(s.pc)+'٪'}</span></div><div class="rb">${r.entries.map(e=>`<div class="hl">${line(e)}</div>`).join('')}<div class="rm"><span>😴 ${fa(r.sleep)} ساعت خواب</span><span>${MOOD[r.mood]}</span><span>تمرکز: ${'★'.repeat(r.focus)}</span>${r.demo?'<span>نمونه</span>':''}</div>${r.note?`<p>${esc(r.note)}</p>`:''}</div></article>`};
const days=()=>Object.keys(S.reports).sort().reverse();
/* ---- views ---- */
const VIEWS={
load(){return '<div class="done"><div class="big">⏳</div><h2>در حال بارگذاری…</h2></div>'},
notg(){return '<div class="done"><div class="big">📱</div><h2>این صفحه فقط داخل تلگرام کار می‌کند</h2><p class="hl">ربات باف را در تلگرام باز کن و از دکمه‌ی منو وارد شو.</p></div>'},
denied(){return '<div class="done"><div class="big">🔒</div><h2>اجازه‌ی ثبت‌نام نداری</h2><p class="hl">ثبت‌نام فعلاً فقط برای افراد دعوت‌شده باز است.</p></div>'},
err(){return '<div class="done"><div class="big">⚠️</div><h2>اتصال برقرار نشد</h2><p class="hl">اینترنت را بررسی کن و دوباره تلاش کن.</p><button class="cta" onclick="location.reload()">تلاش دوباره</button></div>'},
reg(){const nc=boot&&boot.needs_code;return `<div class="fh"><h2>ثبت‌نام در باف 👋</h2></div><p class="hl">اولین ورودته! اطلاعات زیر را کامل کن؛ از این به بعد دیگر لازم نیست وارد شوی.</p>
 <label>نام کاربری <small>(۳ تا ۲۴ حرف یا عدد)</small></label><input maxlength="24" value="${esc(rg.u)}" oninput="rg.u=this.value" placeholder="مثلاً علی">
 ${nc?`<label>کد دعوت</label><input value="${esc(rg.c)}" oninput="rg.c=this.value" placeholder="کدی که بهت داده‌اند">`:''}
 <label>رمز عبور <small>(اختیاری، حداقل ۸ حرف)</small></label><input type="password" value="${esc(rg.p)}" oninput="rg.p=this.value" autocomplete="new-password">
 <label>رشته</label>${Object.entries(FIELDS).map(([k,v])=>`<button class="fc ${rg.f===k?'on':''}" onclick="rg.f='${k}';hap();render()"><i>${v[0]}</i><b>${v[1]}</b></button>`).join('')}
 <label>پایه</label><div class="chips" style="flex-wrap:wrap">${Object.entries(GL).map(([k,v])=>`<button class="chip ${rg.g===k?'on':''}" onclick="rg.g='${k}';hap();render()">${v}</button>`).join('')}</div>
 <div class="err">${esc(rg.err)}</div><button class="cta" onclick="enter()">ورود به باف</button>`},
plan(){const days=[];if(S.plan)for(let o=0;o<7;o++){const k=iso(-o),p=planFor(k);if(p)days.push([k,p])}
 return `<div class="fh"><button class="bk" onclick="go('home')" aria-label="بازگشت">→</button><h2>برنامه‌ی مطالعه</h2></div>
 ${S.plan?`<p class="hl"><b>${esc(S.plan.title)}</b> · شروع: ${fd(S.plan.start_date)}</p>${days.map(([k,p])=>`<div class="card2"><h4>${fd(k)}</h4>${planLines(p)}<div class="hl"><b>جمع: ${hm(p.total)}</b></div></div>`).join('')||'<div class="empty">برای ۷ روز آینده برنامه‌ای نیست.</div>'}<button class="sec2" onclick="delPlan()">🗑 حذف برنامه</button>`:''}
 <label>${S.plan?'جایگزین کردن برنامه':'افزودن برنامه'} <small>(متنی که از هوش مصنوعی گرفتی)</small></label>
 <textarea id="pt" style="min-height:140px;direction:ltr;text-align:left" placeholder='{"title":"...","start_date":"2026-10-20","days":[...]}'></textarea>
 <input type="file" accept=".json,.txt,application/json" onchange="readPlan(this)" style="margin-top:8px">
 <div class="err" id="pe"></div><button class="cta" onclick="savePlan()">ذخیره‌ی برنامه</button>`},
home(){const T0=iso(0),tr=S.reports[T0],s=tr&&sumR(tr),wk=[6,5,4,3,2,1,0].map(o=>{const r=S.reports[iso(o)];return{r,m:r?sumR(r).min:0,d:WD[dt(iso(o)).getDay()],t:!o}});
 const mx=Math.max(60,...wk.map(x=>x.m)),W=wk.filter(x=>x.r).map(x=>sumR(x.r)),wp=W.filter(x=>x.pc!=null),wm=W.reduce((a,x)=>a+x.min,0),avg=wp.length?Math.round(wp.reduce((a,x)=>a+x.pc,0)/wp.length):null;
 const h=new Date().getHours(),g=h<5?'شب بخیر 🌙':h<12?'صبح بخیر ☀️':h<17?'ظهر بخیر 🌤':h<21?'عصر بخیر 🌇':'شب بخیر 🌙',av=U.photo_url?`<img src="${esc(U.photo_url)}" alt="">`:esc(U.first_name[0]);
 return `<header class="top"><div class="av">${av}</div><div class="who"><small>${g}</small><b>${esc(NAME)}</b><small>${FIELDS[S.user.field][1]} · ${GL[S.user.grade]}</small></div><span class="vb ok">${inTg?'✓ تأیید شده با تلگرام':'حالت نمایشی'}</span></header>
 <div class="idc"><span>شناسه‌ی تلگرام</span><b dir="ltr">${U.id}</b><button onclick="copyId()">کپی</button></div>
 <div class="lv"><div class="lvh"><span class="em">${tr?'✅':'📝'}</span><div><b>${tr?'گزارش امروز ثبت شده':'امروز هنوز گزارش نفرستادی'}</b><small>${tr?hm(s.min)+' · '+fa(s.tests)+' تست'+(s.pc!=null?' · درصد '+fa(s.pc)+'٪':''):'۲ دقیقه وقت بذار و مطالعه‌ی امروزت رو ثبت کن'}</small></div></div><div class="pb"><i style="width:${Math.min(100,(s?s.min:0)/goalMin()*100)}%"></i></div><small style="color:var(--mut);font-size:11px">هدف روزانه: ${hm(goalMin())}</small></div>
 ${planCard()}
 <div class="stats"><div><b>🔥 ${fa(streak())}</b><small>روز پشت‌سر هم</small></div><div><b style="color:var(--p)">${fa(Math.round(wm/6)/10)}</b><small>ساعت در ۷ روز</small></div><div><b style="color:${col(avg)}">${avg==null?'—':fa(avg)+'٪'}</b><small>میانگین درصد</small></div></div>
 <button class="cta" onclick="newR(0)">${tr?'✏️ ویرایش گزارش امروز':'✍️ ثبت گزارش امروز'}</button>
 <div class="card2"><h4>مطالعه‌ی ۷ روز اخیر</h4><div class="bars">${wk.map(x=>`<div class="${x.t?'t':''}"><i style="height:${Math.round(x.m/mx*80)}%" title="${hm(x.m)}"></i>${x.d}</div>`).join('')}</div><small>ستون آبی = امروز</small></div>
 <div class="sh"><h3>آخرین گزارش‌ها</h3><button onclick="go('hist')">همه ←</button></div>${days().slice(0,3).map(dayCard).join('')||'<div class="empty"><i>📭</i>هنوز گزارشی نداری.</div>'}`},
hist(){return `<div class="fh"><h2>تاریخچه‌ی گزارش‌ها</h2></div>${days().map(dayCard).join('')||'<div class="empty"><i>📭</i>هنوز گزارشی نداری.</div>'}`},
form(){const s=F.entries.length?sumR(F):null;
 return `<div class="fh"><button class="bk" onclick="go('home')" aria-label="بازگشت">→</button><h2>گزارش مطالعه</h2></div>
 <div class="chips">${[0,1].map(o=>`<button class="chip ${F.off===o?'on':''}" onclick="newR(${o})">${o?'دیروز':'امروز'} · ${fd(iso(o))}</button>`).join('')}</div>
 <label>درس‌هایی که خواندی</label>
 ${F.entries.map((e,i)=>`<div class="ent" onclick="openS(${i})"><span class="ce">📘</span><div class="n"><b>${esc(e.sub)}</b><small>${hm(e.min)} · ${fa(e.tests)} تست · ✅ ${fa(e.ok)} ❌ ${fa(e.bad)} ⚪ ${fa(e.tests-e.ok-e.bad)}</small></div><span class="pct" style="color:${col(pc(e))}">${pc(e)==null?'—':fa(pc(e))+'٪'}</span><button class="x" onclick="event.stopPropagation();delE(${i})" aria-label="حذف">✕</button></div>`).join('')}
 <button class="addb" onclick="openS(-1)">＋ افزودن درس</button>
 ${s?`<div class="sumb"><div><b>${hm(s.min)}</b><small>کل مطالعه</small></div><div><b>${fa(s.tests)}</b><small>کل تست</small></div><div><b style="color:${col(s.pc)}">${s.pc==null?'—':fa(s.pc)+'٪'}</b><small>درصد کل</small></div></div>`:''}
 <label>ساعت خواب دیشب</label><div class="step"><button onclick="F.sleep=Math.max(0,F.sleep-.5);$('sl').value=F.sleep">−</button><input id="sl" inputmode="decimal" value="${F.sleep}" oninput="F.sleep=parseFloat(this.value)||0"><button onclick="F.sleep=Math.min(16,F.sleep+.5);$('sl').value=F.sleep">+</button></div>
 <label>حال و هوای امروز</label><div class="moods">${MOOD.map((m,i)=>`<button class="${F.mood===i?'on':''}" onclick="F.mood=${i};hap();render()">${m}</button>`).join('')}</div>
 <label>میزان تمرکز</label><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${F.focus>=n?'on':''}" onclick="F.focus=${n};hap();render()" aria-label="${n}">★</button>`).join('')}</div>
 <label>یادداشت <small>(اختیاری)</small></label><textarea maxlength="300" style="min-height:80px" oninput="F.note=this.value" placeholder="مثلاً مبحثی که سخت بود یا برنامه‌ی فردا">${esc(F.note)}</textarea>
 <div class="err" id="fe"></div><div class="idn">گزارش به نام <b>${esc(NAME)}</b> با شناسه‌ی <b dir="ltr">${U.id}</b> ثبت می‌شود.</div>
 <button class="cta" id="sb" onclick="send()">ارسال گزارش 🚀</button>`},
done(){const E=['🎉','✨','🌟','💚','🎊','⭐'],s=sumR(last),c=Array.from({length:22},(_,i)=>`<i style="--x:${Math.round((Math.random()-.5)*340)}px;--y:${Math.round(Math.random()*-180-20)}px;--r:${Math.round(Math.random()*540)}deg;animation-delay:${(i*.03).toFixed(2)}s">${E[i%6]}</i>`).join('');
 return `<div class="done"><div class="conf">${c}</div><div class="big">✅</div><h2>گزارشت ثبت شد!</h2><small style="color:var(--mut)">آفرین! ${hm(s.min)} مطالعه و ${fa(s.tests)} تست 💚</small>
 <div class="pcw" style="margin-top:14px">${ring(s.pc)}<div><b>🔥 ${fa(streak())} روز پشت‌سر هم</b><b>درصد کل امروز</b></div></div>
 <button class="cta" style="margin-top:12px" onclick="go('home')">بازگشت به خانه</button><button class="sec2" onclick="go('hist')">تاریخچه‌ی گزارش‌ها</button></div>`}};
/* ---- actions ---- */
function render(){$('app').innerHTML=`<section class="scr">${VIEWS[view]()}</section>`;const n=$('nav'),m=view==='home'||view==='hist';n.className=m?'':'hid';
 n.innerHTML=`<button class="${view==='home'?'on':''}" onclick="go('home')"><i>🏠</i>خانه</button><button class="fab" onclick="newR(0)" aria-label="گزارش جدید">＋</button><button class="${view==='hist'?'on':''}" onclick="go('hist')"><i>🗂</i>تاریخچه</button>`;
 try{view==='home'?tg.BackButton.hide():tg.BackButton.show()}catch(e){}}
function go(v){view=v;hap();scrollTo(0,0);render()}
function tog(k){open=open===k?null:k;hap();render()}
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2000)}
function copyId(){try{navigator.clipboard.writeText(String(U.id)).then(()=>toast('شناسه کپی شد'),()=>toast('شناسه: '+U.id))}catch(e){toast('شناسه: '+U.id)}}
async function enter(){rg.err='';const u=rg.u.trim();
 if(!/^[A-Za-z0-9_\u0600-\u06FF]{3,24}$/.test(u))rg.err='نام کاربری باید ۳ تا ۲۴ حرف، عدد یا _ باشد.';else if(rg.p&&rg.p.length<8)rg.err='رمز حداقل ۸ حرف باشد.';else if(!rg.f||!rg.g)rg.err='رشته و پایه را انتخاب کن.';
 if(rg.err)return render();
 try{const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({init_data:INIT,username:u,password:rg.p||null,invite_code:rg.c||null,field:rg.f,grade:rg.g})});
  setTok(d.token);S.user=d.user;await loadData();go('home')}
 catch(e){const m={username_taken:'این نام کاربری قبلاً گرفته شده.',not_allowed:'اجازه‌ی ثبت‌نام نداری.',bad_code:'کد دعوت درست نیست.',already_registered:'قبلاً ثبت‌نام کرده‌ای.',invalid_init_data:'برنامه را دوباره از داخل تلگرام باز کن.'};rg.err=m[e.detail]||'ثبت‌نام انجام نشد. دوباره تلاش کن.';render()}}
function newR(o=0){const r=S.reports[iso(o)];F=r?JSON.parse(JSON.stringify(r)):{entries:[],sleep:7,mood:3,focus:3,note:''};F.off=o;delete F.demo;go('form')}
function delE(i){F.entries.splice(i,1);hap();render()}
/* entry sheet */
const stp=(k,st)=>`<div class="step"><button onclick="adj('${k}',-${st})">−</button><input id="e_${k}" inputmode="numeric" value="${E[k]}" oninput="setv('${k}',this.value)"><button onclick="adj('${k}',${st})">+</button></div>`;
function openS(i){E=i>=0?{...F.entries[i],i}:{i:-1,sub:null,min:60,tests:20,ok:0,bad:0};sheet();$('ov').classList.add('on')}
function closeS(){$('ov').classList.remove('on')}
function sheet(){$('sheet').innerHTML=`<div class="fh"><h2>${E.i<0?'افزودن درس':'ویرایش درس'}</h2></div>
 <label>درس</label><div class="chips" style="flex-wrap:wrap">${S.subjects.map(x=>x.name).map(s=>`<button class="chip ${E.sub===s?'on':''}" onclick="E.sub='${s}';sheet()">${s}</button>`).join('')}</div>
 <label>مدت مطالعه (دقیقه)</label>${stp('min',15)}<div class="chips" style="margin-top:8px">${[30,60,90,120].map(m=>`<button class="chip" onclick="E.min=${m};sync()">${fa(m)}</button>`).join('')}</div>
 <div class="row3"><div><small>تعداد تست</small>${stp('tests',1)}</div><div><small>درست ✅</small>${stp('ok',1)}</div><div><small>غلط ❌</small>${stp('bad',1)}</div></div>
 <div class="pcw" id="live"></div><div class="err" id="se"></div><button class="cta" onclick="saveE()">ثبت درس</button>`;live()}
function adj(k,d){E[k]=Math.max(0,(+E[k]||0)+d);hap();sync()}
function setv(k,v){E[k]=Math.max(0,parseInt(v)||0);live()}
function sync(){['min','tests','ok','bad'].forEach(k=>{const x=$('e_'+k);if(x)x.value=E[k]});live()}
function live(){const b=E.tests-E.ok-E.bad;$('live').innerHTML=ring(pc(E))+`<div><b>✅ ${fa(E.ok)} درست</b><b>❌ ${fa(E.bad)} غلط</b><b>⚪ ${fa(Math.max(0,b))} نزده</b></div>`;$('se').textContent=b<0?'مجموع درست و غلط از تعداد تست بیشتر است.':''}
function saveE(){const e=$('se');if(!E.sub)return e.textContent='درس را انتخاب کن.';if(E.ok+E.bad>E.tests)return;if(!E.min&&!E.tests)return e.textContent='مدت مطالعه یا تعداد تست را وارد کن.';
 if(F.entries.some((x,i)=>x.sub===E.sub&&i!==E.i))return e.textContent='این درس قبلاً اضافه شده؛ همان را ویرایش کن.';
 const v={sid:(S.subjects.find(x=>x.name===E.sub)||{}).id,sub:E.sub,min:E.min,tests:E.tests,ok:E.ok,bad:E.bad};E.i<0?F.entries.push(v):F.entries[E.i]=v;closeS();hap('medium');render()}
async function send(){const e=$('fe'),bad=m=>{e.textContent=m;e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');try{tg.HapticFeedback.notificationOccurred('error')}catch(x){}};
 if(!F.entries.length)return bad('حداقل یک درس اضافه کن.');
 const body={sleep_hours:F.sleep,mood:F.mood,focus:F.focus,note:F.note.trim(),entries:F.entries.map(x=>({subject_id:x.sid,minutes:x.min,tests:x.tests,correct:x.ok,wrong:x.bad}))};
 const btn=$('sb');if(btn){btn.disabled=true;btn.textContent='در حال ارسال…'}
 try{await api('/api/reports/'+iso(F.off),{method:'PUT',body:JSON.stringify(body)});await loadData();last=S.reports[iso(F.off)];
  try{tg.HapticFeedback.notificationOccurred('success')}catch(x){}view='done';scrollTo(0,0);render()}
 catch(x){if(btn){btn.disabled=false;btn.textContent='ارسال گزارش 🚀'}bad(x.status===401?'نشست تمام شده؛ برنامه را دوباره باز کن.':'ارسال نشد. اینترنت را بررسی کن و دوباره تلاش کن.')}}
const planFor=k=>{if(!S.plan)return null;const i=Math.round((dt(k)-dt(S.plan.start_date))/864e5),d=S.plan.days[i];if(!d)return null;const it=d.items||[];return{items:it,note:d.note||'',total:it.reduce((a,x)=>a+(+x.minutes||0),0)}};
const goalMin=()=>{const p=planFor(iso(0));return p&&p.total?p.total:GOAL};

const planLines=p=>p.items.map(i=>`<div class="hl">• ${esc(i.subject)} · ${hm(i.minutes)}${i.topic?' · '+esc(i.topic):''}</div>`).join('');
function planCard(){const p=planFor(iso(0));return `<div class="card2"><div class="sh2"><h4>📋 برنامه‌ی امروز</h4><button class="more-btn" onclick="go('plan')">${S.plan?'همه‌ی برنامه ←':'افزودن برنامه ←'}</button></div>${p?`${planLines(p)}<div class="hl"><b>جمع امروز: ${hm(p.total)}</b></div>${p.note?`<small>${esc(p.note)}</small><br>`:''}<small>این فقط راهنماست؛ هر چه واقعاً خواندی را در گزارش ثبت کن.</small>`:`<small>${S.plan?'برای امروز برنامه‌ای در فایل نیست.':'هنوز برنامه‌ای اضافه نکرده‌ای.'}</small>`}</div>`}
function checkPlan(p){if(!p||typeof p!=='object')return 'ساختار فایل درست نیست.';if(!/^\d{4}-\d{2}-\d{2}$/.test(p.start_date||''))return 'start_date باید مثل 2026-10-20 باشد.';if(!Array.isArray(p.days)||!p.days.length)return 'فهرست days خالی است.';if(p.days.length>120)return 'حداکثر ۱۲۰ روز مجاز است.';
 for(const d of p.days){if(!Array.isArray(d.items))return 'هر روز باید items داشته باشد.';for(const i of d.items){if(!i.subject||!Number.isInteger(i.minutes)||i.minutes<0||i.minutes>1440)return 'هر درس باید subject و minutes (عدد صحیح) داشته باشد.'}}return null}
function readPlan(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('pt').value=r.result};r.readAsText(f)}
async function savePlan(){const e=$('pe');let p;try{p=JSON.parse($('pt').value)}catch(x){e.textContent='متن برنامه یک JSON معتبر نیست. دوباره از هوش مصنوعی بگیر.';return}
 const m=checkPlan(p);if(m){e.textContent=m;return}
 try{await api('/api/plan',{method:'PUT',body:JSON.stringify(p)});await loadData();toast('برنامه ذخیره شد');go('home')}catch(x){e.textContent=x.status===401?'نشست تمام شده؛ برنامه را دوباره باز کن.':'ذخیره نشد. ساختار برنامه یا اینترنت را بررسی کن.'}}
async function delPlan(){try{await api('/api/plan',{method:'DELETE'});S.plan=null;hap();render()}catch(x){toast('حذف نشد')}}
render();startApp();
</script>
</body>
</html>
