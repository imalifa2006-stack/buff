<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت باف</title><style>body{font-family:Tahoma,sans-serif;background:#f1f7f3;color:#173b29;max-width:850px;margin:30px auto;padding:16px}section{background:white;padding:22px;border-radius:18px;margin:15px 0;box-shadow:0 5px 24px #17452b10}input,select,button{font:inherit;padding:12px;margin:5px;border-radius:9px;border:1px solid #a9c9b6}button{background:#177b49;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:right}small{color:#687}#panel{display:none}</style><h1>پنل مدیر اصلی باف</h1><section id="login"><h2>ورود مدیر</h2><input id="u" placeholder="نام کاربری" autocomplete="username"><input id="p" type="password" placeholder="رمز عبور" autocomplete="current-password"><button onclick="login()">ورود</button></section><div id="panel"><section><h2>مشاورها</h2><input id="adv" placeholder="یوزرنیم مشاور"><button onclick="addAdvisor()">افزودن / تأیید مشاور</button><div id="advisors"></div></section><section><h2>افزودن دانش‌آموز</h2><p><small>مشاور برای هر دانش‌آموز اجباری است.</small></p><input id="su" placeholder="یوزرنیم دانش‌آموز"><input id="sn" placeholder="نام"><input id="sp" type="password" placeholder="رمز حداقل ۸ حرف"><select id="sa"></select><select id="sf"><option value="r">ریاضی</option><option value="t">تجربی</option><option value="e">انسانی</option></select><select id="sg"><option value="10">دهم</option><option value="11">یازدهم</option><option value="12">دوازدهم</option><option value="grad">فارغ‌التحصیل</option></select><button onclick="addStudent()">افزودن و فعال‌سازی</button></section><section><h2>دانش‌آموزها</h2><div id="students"></div></section></div><p id="msg"></p><script>
let token=sessionStorage.getItem('baf_admin_token')||'';const $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.detail||'خطا');return d}async function login(){try{const d=await req('auth/login','POST',{username:$('u').value,password:$('p').value});if(d.user.role!=='admin')throw Error('این حساب مدیر اصلی نیست');token=d.token;sessionStorage.setItem('baf_admin_token',token);await load()}catch(err){$('msg').textContent=err.message}}async function load(){try{const all=await req('admin/users');const verified=await req('admin/verified-advisors');$('login').style.display='none';$('panel').style.display='block';const advisors=all.filter(x=>x.role==='advisor'),students=all.filter(x=>x.role==='student');$('sa').innerHTML=advisors.filter(x=>x.status==='approved').map(x=>`<option value="${e(x.username)}">${e(x.username)}</option>`).join('');$('advisors').innerHTML=verified.map(x=>`<p>${e(x.username)} — ${x.active?'مجاز':'غیرفعال'} — ${e(x.account_status||'هنوز ثبت‌نام نکرده')} <button onclick="delAdvisor('${e(x.username)}')">غیرفعال‌سازی</button></p>`).join('')||'مشاوری ثبت نشده است';$('students').innerHTML=students.map(x=>`<p>${e(x.username)} — ${e(x.status)} — مشاور: ${e(x.advisor_username)} <button onclick="move('${e(x.username)}')">تغییر مشاور</button><button onclick="delStudent('${e(x.username)}')">غیرفعال‌سازی</button></p>`).join('')||'دانش‌آموزی نیست';}catch(err){$('msg').textContent=err.message}}async function act(path,method,body){try{await req(path,method,body);$('msg').textContent='انجام شد';await load()}catch(err){$('msg').textContent=err.message}}function addAdvisor(){act('admin/advisors','POST',{username:$('adv').value.trim()})}function delAdvisor(u){if(confirm('مشاور غیرفعال شود؟'))act('admin/advisors/'+encodeURIComponent(u),'DELETE')}function addStudent(){act('admin/students','POST',{username:$('su').value.trim(),first_name:$('sn').value,password:$('sp').value,advisor_username:$('sa').value,field:$('sf').value,grade:$('sg').value})}function delStudent(u){if(confirm('دانش‌آموز غیرفعال شود؟'))act('admin/students/'+encodeURIComponent(u),'DELETE')}function move(u){const a=prompt('یوزرنیم مشاور جدید:');if(a)act('admin/students/'+encodeURIComponent(u)+'/advisor','PUT',{username:a})}if(token)load();
</script></html>
